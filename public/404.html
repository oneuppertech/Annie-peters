
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      const segmentCount = 1;

      const location = window.location;
      const pathSegments = location.pathname
        .split('/')
        .filter(Boolean);

      const repo = pathSegments.slice(0, segmentCount);
      const route = pathSegments.slice(segmentCount);

      const redirectUrl =
        location.origin +
        '/' +
        repo.join('/') +
        '/?/' +
        route.join('/') +
        location.search +
        location.hash;

      location.replace(redirectUrl);
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
