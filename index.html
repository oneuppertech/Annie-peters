<!doctype html>
<html lang="en">
  <head>
    <script>
      ;(function () {
        const search = window.location.search

        if (search.startsWith('?/')) {
          const route = search.slice(2).replace(/~and~/g, '&')

          const newUrl = window.location.pathname + route + window.location.hash

          window.history.replaceState(null, '', newUrl)
        }
      })()
    </script>
